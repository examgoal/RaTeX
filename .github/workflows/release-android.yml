# On a version tag (e.g. v0.1.14-eg.1): build the AAR, publish com.examgoal:ratex-android
# to the GitHub-hosted Maven repository on the `maven` branch
# (https://raw.githubusercontent.com/<owner>/RaTeX/maven), and attach the AAR to the
# GitHub Release. Maven Central publishing also runs when its secrets are set:
# SONATYPE_NEXUS_USERNAME, SONATYPE_NEXUS_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE.
name: Release Android (Maven)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    env:
      # Maven Central needs Sonatype credentials; without them only the GitHub repository is published
      HAS_MAVEN_CENTRAL: ${{ secrets.SONATYPE_NEXUS_USERNAME != '' }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      - name: Build Rust Android libraries
        run: bash platforms/android/build-android.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - name: Assemble and verify release AAR
        run: |
          cd demo/android
          ./gradlew :ratex-android:assembleRelease --no-daemon -PlibraryVersion=${{ steps.version.outputs.version }}
          cd ../..
          python3 scripts/verify_android_elf.py platforms/android/build/outputs/aar/ratex-android-release.aar

      - name: Publish to the GitHub Maven repository (maven branch)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          REPO_DIR="$RUNNER_TEMP/maven-repo"
          (cd demo/android && ./gradlew :ratex-android:publishAllPublicationsToGithubMavenRepository --no-daemon \
              -PlibraryVersion="$VERSION" -PmavenRepoDir="$REPO_DIR")
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_DIR="$RUNNER_TEMP/maven-branch"
          if git ls-remote --exit-code --heads origin maven >/dev/null; then
            git fetch --depth=1 origin maven
            git worktree add "$BRANCH_DIR" FETCH_HEAD
            git -C "$BRANCH_DIR" switch -c maven
          else
            git worktree add --detach "$BRANCH_DIR"
            git -C "$BRANCH_DIR" switch --orphan maven
          fi
          cp -R "$REPO_DIR"/. "$BRANCH_DIR"/
          cd "$BRANCH_DIR"
          git add -A
          git commit -m "ratex-android $VERSION"
          git push origin HEAD:maven

      - name: Publish to Maven Central
        # Central Portal 验证较慢，build service 轮询可能超时，但包已上传并触发 release，不影响实际发布
        if: env.HAS_MAVEN_CENTRAL == 'true'
        continue-on-error: true
        run: |
          cd demo/android
          ./gradlew :ratex-android:publishAndReleaseToMavenCentral --no-daemon -PlibraryVersion=${{ steps.version.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ratex-android-aar
          path: platforms/android/build/outputs/aar/*.aar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: platforms/android/build/outputs/aar/*.aar
